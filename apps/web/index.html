<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0f0c" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Klein</title>
    <script>
      // A failed module load leaves #root empty, which looks like a blank page.
      // Show what failed instead so the device can report it without DevTools.
      (function () {
        function renderFailure(reason) {
          var root = document.getElementById("root");
          if (!root || root.childNodes.length > 0) return;
          var script = document.querySelector('script[type="module"]');
          var panel = document.createElement("pre");
          panel.style.cssText =
            "white-space:pre-wrap;padding:16px;margin:0;font:12px/1.6 monospace;color:#e5e7eb;background:#0a0f0c";
          panel.textContent =
            "Failed to load the Klein Web UI\n\n" +
            reason +
            "\nasset: " +
            (script ? script.src : "unknown") +
            "\nUA: " +
            navigator.userAgent;
          root.appendChild(panel);
        }
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target !== window && target.tagName !== "SCRIPT") return;
            renderFailure(
              event.message || (target && (target.src || target.href)) || "unknown error",
            );
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (event) {
          renderFailure(String(event.reason));
        });
        setTimeout(function () {
          renderFailure("The app did not render in time");
        }, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
